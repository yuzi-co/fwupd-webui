[project]
name = "fwupd-webui"
version = "0.1.1"
license = "MIT"
license-files = ["LICENSE"]
description = "Read-only web UI for fwupd firmware inventory"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "pydantic>=2.10",
    # FastAPI needs this to parse Form() bodies, which the flash confirm step posts.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwupd_webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests need a real fwupdtool binary; they run inside the container
# image via `make integration`, not in the default suite.
norecursedirs = ["tests/integration"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
