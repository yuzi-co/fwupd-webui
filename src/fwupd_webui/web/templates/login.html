<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - fwupd</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login">
    <h1>Firmware Inventory</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">
      Set by <code>FWUPD_WEBUI_PASSWORD</code>, or generated at first start and saved in
      <code>/var/lib/fwupd/.webui-password</code>.
    </p>
  </main>
</body>
</html>
