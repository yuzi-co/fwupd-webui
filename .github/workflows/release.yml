# Builds and publishes the container image to GHCR, and cuts a GitHub Release.
#
# Fires on a version tag:
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# Also runnable by hand from the Actions tab, which is useful for re-publishing
# an existing tag without moving it.
#
# The first run creates the package. GHCR packages start private even on a public
# repository, so after the first publish set the package visibility to public
# once, at Packages -> fwupd-webui -> Settings.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tag comes either from the ref that triggered this or from operator
      # input, and ends up in the image tag list. Constrain it, and pass it
      # through the environment rather than interpolating into the script.
      - name: Resolve and validate version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing tag '$TAG': expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The version in pyproject and the tag being published must agree, or the
      # container reports a version nobody can correlate with a release.
      - name: Check pyproject version matches the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PYPROJECT="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$PYPROJECT" != "$VERSION" ]; then
            echo "pyproject version '$PYPROJECT' does not match tag '$VERSION'" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishing an image that fails its own integration suite would be worse
      # than publishing nothing, so the suite runs against the built image first.
      # It performs a real flash of fwupd's synthetic device.
      - name: Integration test against real fwupdtool
        run: ./scripts/integration-test.sh

      # amd64 only, matching what is tested. fwupd device enumeration has not
      # been verified on arm64 hardware.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=Web UI for fwupd firmware inventory and updates
            org.opencontainers.image.licenses=MIT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            printf 'Container image:\n\n'
            printf '    docker pull ghcr.io/%s:%s\n\n' "$REPO" "$TAG"
            printf 'Read-only by default. Firmware flashing requires setting\n'
            printf 'FWUPD_WEBUI_ENABLE_FLASHING=true, and even then every flash requires\n'
            printf 'typing the device name. System firmware (BIOS, UEFI capsule, SPI flash)\n'
            printf 'is refused outright.\n\n'
            printf 'Requires --privileged; the README explains why that cannot currently be\n'
            printf 'narrowed to a capability set.\n'
          } > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
