# Builds and publishes the container image to GHCR.
#
# DELIBERATELY NOT AUTOMATIC. There is no push or tag trigger: nothing publishes
# until someone runs this by hand from the Actions tab. Until the first run, no
# image exists at ghcr.io/yuzi-co/fwupd-webui and the README says so.
#
# To start publishing:
#   1. Run this workflow once (Actions -> Release -> Run workflow).
#   2. Make the resulting package public, otherwise pulls need credentials the
#      Unraid Community Applications template has no field for.
#   3. Add the tag trigger below and update the README install section.
#
# To publish on tags instead, add:
#   on:
#     push:
#       tags: ["v*"]
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # inputs.tag is operator-supplied and ends up in the image tag list. Only
      # collaborators can dispatch this, but a newline in the value would append
      # tags nobody asked for, so constrain it. Passed via env rather than
      # interpolated into the script.
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing tag '$TAG': expected vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      # The image is amd64 only, matching what is tested. fwupd device
      # enumeration has not been verified on arm64 hardware.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishing an image that fails its own integration suite would be worse
      # than publishing nothing, so the suite runs against the built image first.
      - name: Integration test against real fwupdtool
        run: ./scripts/integration-test.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Web UI for fwupd firmware inventory and updates
            org.opencontainers.image.licenses=MIT
